<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-label="Immagine placeholder di un gatto">
  <style>
    .cat-body { fill: #d4a574; }
    .cat-detail { fill: #000; }
    .cat-eye { fill: #fff; }
    .cat-pupil { fill: #000; }
  </style>
  
  <!-- Background -->
  <rect width="200" height="200" fill="#f5f5f5"/>
  
  <!-- Ears -->
  <polygon points="70,30 55,60 85,55" class="cat-body"/>
  <polygon points="130,30 145,60 115,55" class="cat-body"/>
  <polygon points="70,40 63,55 77,52" class="cat-detail" opacity="0.3"/>
  <polygon points="130,40 137,55 123,52" class="cat-detail" opacity="0.3"/>
  
  <!-- Head -->
  <circle cx="100" cy="90" r="45" class="cat-body"/>
  
  <!-- Eyes -->
  <circle cx="85" cy="80" r="6" class="cat-eye"/>
  <circle cx="115" cy="80" r="6" class="cat-eye"/>
  <circle cx="85" cy="80" r="3" class="cat-pupil"/>
  <circle cx="115" cy="80" r="3" class="cat-pupil"/>
  
  <!-- Nose -->
  <polygon points="100,95 95,105 105,105" fill="#ff69b4"/>
  
  <!-- Mouth -->
  <path d="M 100 105 Q 90 115 85 110" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 100 105 Q 110 115 115 110" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Whiskers -->
  <line x1="55" y1="85" x2="45" y2="80" stroke="#000" stroke-width="1.5"/>
  <line x1="55" y1="95" x2="45" y2="100" stroke="#000" stroke-width="1.5"/>
  <line x1="145" y1="85" x2="155" y2="80" stroke="#000" stroke-width="1.5"/>
  <line x1="145" y1="95" x2="155" y2="100" stroke="#000" stroke-width="1.5"/>
  
  <!-- Body -->
  <ellipse cx="100" cy="145" rx="35" ry="40" class="cat-body"/>
  
  <!-- Front Paws -->
  <rect x="85" y="175" width="8" height="20" class="cat-body" rx="4"/>
  <rect x="107" y="175" width="8" height="20" class="cat-body" rx="4"/>
  
  <!-- Tail -->
  <path d="M 135 150 Q 160 140 155 100" stroke="#d4a574" stroke-width="12" fill="none" stroke-linecap="round"/>
</svg>
